name: Build Cortex
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip source
        run: |
          if [ -f source.zip ]; then
            unzip -q source.zip -d .
            rm source.zip
          fi
          
          GRADLEW_PATH=$(find . -name "gradlew" -type f -print -quit)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "ОШИБКА: файл gradlew не найден!"
            exit 1
          fi
          DIR=$(dirname "$GRADLEW_PATH")
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
          
          # Заменяем старые файлы сборки на наши новые
          cp build.gradle $DIR/build.gradle
          cp gradle.properties $DIR/gradle.properties
          mkdir -p $DIR/gradle/wrapper
          cp gradle/wrapper/gradle-wrapper.properties $DIR/gradle/wrapper/gradle-wrapper.properties

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          cd ${{ env.PROJECT_DIR }}
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Cortex-JAR
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
