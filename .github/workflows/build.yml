name: Build Cortex
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip and Auto-Config
        run: |
          if [ -f source.zip ]; then
            unzip -q source.zip -d .
            rm source.zip
          fi
          
          GRADLEW_PATH=$(find . -name "gradlew" -type f -print -quit)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "ОШИБКА: файл gradlew не найден!"
            exit 1
          fi
          DIR=$(dirname "$GRADLEW_PATH")
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
          cd $DIR

          # 1. settings.gradle (репозиторий Fabric)
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'cortex-client'
          EOF

          # 2. build.gradle (Правильный плагин и версия для 1.21.11)
          cat > build.gradle << 'EOF'
          plugins {
              id 'net.fabricmc.fabric-loom-remap' version '1.14-SNAPSHOT'
              id 'maven-publish'
          }
          version = project.mod_version
          group = project.maven_group
          base { archivesName = project.archives_base_name }
          repositories { mavenCentral() }
          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }
          
          sourceSets {
              main {
                  java {
                      srcDirs = ['src/main/java', 'src/client/java', 'src']
                  }
                  resources {
                      srcDirs = ['src/main/resources', 'src/client/resources', 'src']
                  }
              }
          }

          processResources { inputs.property "version", project.version; filesMatching("fabric.mod.json") { expand "version": project.version } }
          tasks.withType(JavaCompile).configureEach {
              it.options.encoding = "UTF-8"
              it.options.release = 21
          }
          EOF

          # 3. gradle.properties (Версии для 1.21.11)
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2G
          org.gradle.parallel=true
          minecraft_version=1.21.11
          yarn_mappings=1.21.11+build.6
          loader_version=0.19.3
          fabric_version=0.141.4+1.21.11
          mod_version=1.0.0
          maven_group=com.cortex
          archives_base_name=cortex-client
          EOF

          # 4. gradle-wrapper.properties (Gradle 9.2 для Loom 1.14)
          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.2-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          cd ${{ env.PROJECT_DIR }}
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Cortex-JAR
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
